name: fintrack

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${FINTRACK_SA_PASSWORD:?Defina FINTRACK_SA_PASSWORD no arquivo .env}
    ports:
      - "14330:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: FinTrack.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FinTrack: Server=db;Database=FinTrack;User Id=sa;Password=${FINTRACK_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Jwt__Key: ${FINTRACK_JWT_KEY:?Defina FINTRACK_JWT_KEY no arquivo .env}
      Jwt__Issuer: FinTrack.Api
      Jwt__Audience: FinTrack.Web
      Jwt__LifetimeMinutes: 60
      Database__MigrateOnStartup: "true"
    ports:
      - "5095:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: fintrack-web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
