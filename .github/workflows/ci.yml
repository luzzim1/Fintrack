name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Start isolated SQL Server
        shell: bash
        run: |
          password="Ci_$(openssl rand -hex 16)aA1!"
          echo "::add-mask::$password"
          docker run --name fintrack-ci-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" -p 1433:1433 -d mcr.microsoft.com/mssql/server:2022-latest
          for attempt in {1..30}; do
            if docker exec fintrack-ci-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -Q "SELECT 1" >/dev/null 2>&1; then break; fi
            if [ "$attempt" = 30 ]; then docker logs fintrack-ci-sql; exit 1; fi
            sleep 2
          done
          echo "FINTRACK_TEST_CONNECTION=Server=localhost;User Id=sa;Password=$password;Encrypt=True;TrustServerCertificate=True" >> "$GITHUB_ENV"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger "console;verbosity=minimal"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fintrack-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fintrack-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f FinTrack.Api/Dockerfile -t fintrack-api .
      - run: docker build -t fintrack-web fintrack-web
